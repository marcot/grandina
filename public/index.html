<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d1a">
  <title>Grandina · grandine in tempo reale</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <h1>Grandina</h1>
      <span class="tag">grandine in tempo reale</span>
    </div>
    <div class="status" title="Aggiornamento dati radar">
      <span id="staleDot" class="dot ok"></span>
      <span id="staleText">caricamento…</span>
    </div>
  </header>

  <section id="controls" aria-label="Prodotti radar">
    <div class="chips" id="chips"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div id="mapWrap">
    <div id="map"></div>
    <form id="search" autocomplete="off">
      <input id="q" name="q" placeholder="Cerca un comune…" aria-label="Cerca un comune">
      <button type="submit" aria-label="Cerca">Cerca</button>
      <span id="searchMsg"></span>
    </form>
  </div>

  <aside id="panel" class="closed" aria-label="Dettaglio rischio grandine">
    <button id="panelToggle" type="button" aria-label="Mostra o nascondi pannello">›</button>
    <div id="panelBody"></div>
  </aside>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
